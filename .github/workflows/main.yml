name: Proxy CI/CD

on:
  push:
    branches:
      - dev
      - main

    paths-ignore:
      - README.md

  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  security-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@v3
        with:
          git-args: ${{ github.event.before }}..${{ github.sha }}
          log-level: debug
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  build:
    runs-on: ubuntu-latest
    needs: [security-scan]
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:

          - image: proxy
            dockerfile: Dockerfile
            context: .

    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Set image tags
        id: vars
        run: |
          REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          RUN_NUMBER="${{ github.run_number }}"
          if [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            ENV=prod
          else
            ENV=dev
          fi

          echo "repo=$REPO" >> $GITHUB_OUTPUT
          echo "env=$ENV" >> $GITHUB_OUTPUT
          echo "run_number=$RUN_NUMBER" >> $GITHUB_OUTPUT

      - uses: docker/build-push-action@v6

        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          cache-from: type=registry,ref=ghcr.io/${{ steps.vars.outputs.repo }}${{ matrix.image == 'parser' && '' || format('-{0}', matrix.image) }}:${{ steps.vars.outputs.env }}-buildcache
          cache-to:   type=registry,ref=ghcr.io/${{ steps.vars.outputs.repo }}${{ matrix.image == 'parser' && '' || format('-{0}', matrix.image) }}:${{ steps.vars.outputs.env }}-buildcache,mode=max
          tags: |
            ghcr.io/${{ steps.vars.outputs.repo }}${{ matrix.image == 'parser' && '' || format('-{0}', matrix.image) }}:${{ steps.vars.outputs.env }}-latest
            ghcr.io/${{ steps.vars.outputs.repo }}${{ matrix.image == 'parser' && '' || format('-{0}', matrix.image) }}:${{ steps.vars.outputs.env }}-${{ github.sha }}
            ghcr.io/${{ steps.vars.outputs.repo }}${{ matrix.image == 'parser' && '' || format('-{0}', matrix.image) }}:${{ steps.vars.outputs.env }}-${{ steps.vars.outputs.run_number }}

  deploy:
    if: github.ref_name == 'dev' || github.ref_name == 'main'
    needs: build
    runs-on: self-hosted
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'development' }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy
        run: ./scripts/deploy.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          ENV_NAME: ${{ github.ref_name == 'main' && 'production' || 'development' }}
