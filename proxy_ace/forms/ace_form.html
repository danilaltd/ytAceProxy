<h1>{{ title }}</h1>
<form method="post">
    <div>
        {{ form.name.label }}: {{ form.name() }}
        {% if form.name.errors %}<span style="color:red">{{ form.name.errors[0] }}</span>{% endif %}
    </div>
    <div>
        {{ form.content_id.label }}: {{ form.content_id() }}
        <small>40 hexadecimal characters</small>
        {% if form.content_id.errors %}<span style="color:red">{{ form.content_id.errors[0] }}</span>{% endif %}
    </div>
    <button type="submit">Save</button>
</form>
<a href="{{ app_prefix }}{{ url_for('ace_list') }}">Back</a>
